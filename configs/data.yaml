# Configuration de référence du pipeline de données.
# Les valeurs ci-dessous sont celles effectivement utilisées par toutes les
# expériences rapportées (phases 2 à 5) : fenêtre de 60 battements, pas de 30.
# Deux bases, et deux seulement. Les alternatives ont été examinées puis
# écartées pour des raisons méthodologiques, documentées dans docs/datasets.md :
#   - NSRDB   : sujets 100 % sains, donc non notables au sens du F1 par patient
#               (cf. src/utils/metrics.py) ; AFDB fournit déjà 56 % de fenêtres
#               non-FA, le besoin de négatifs supplémentaires n'existe pas.
#   - CinC 2017 : labels au niveau de l'enregistrement sur des segments de ~30 s
#               → ni alternance RS/FA intra-patient, ni F1 par patient possible.
datasets:
  afdb:
    physionet_id: afdb
    enabled: true
    role: train_val
  ltafdb:
    physionet_id: ltafdb
    enabled: true
    role: external_test

paths:
  raw_dir: data/raw
  processed_dir: data/processed

windowing:
  # 60 battements ≈ 45 s de signal à 80 bpm. L'ablation de la phase 3 a montré
  # que passer de 30 à 60 battements est le facteur le plus déterminant.
  window_size: 60
  stride: 30
  label_strategy: majority   # fenêtre positive si ≥ 50 % de ses battements sont en FA

preprocessing:
  # Seul filtrage appliqué : élimination des RR physiologiquement impossibles.
  # Aucune correction de battement ectopique n'est réalisée — c'est un choix
  # assumé, discuté au chapitre 5 du mémoire (limitations).
  normalize: zscore_per_window
  clip_rr_seconds:
    min: 0.3
    max: 2.0

split:
  # GroupKFold (scikit-learn) : découpage déterministe par patient, SANS
  # mélange aléatoire et SANS stratification sur la prévalence de FA.
  # La graine ci-dessous ne pilote donc pas le découpage, seulement
  # l'initialisation des modèles (cf. src/utils/seed.py).
  scheme: patient_groupkfold
  n_folds: 5
  seed: 42

evaluation:
  # Seuil de décision utilisé pour toutes les métriques rapportées.
  # Sa sensibilité est étudiée explicitement par scripts/phase6_analysis.py.
  decision_threshold: 0.5

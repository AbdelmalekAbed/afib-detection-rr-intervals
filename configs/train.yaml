# Configuration d'entraînement du CNN-LSTM.
# Configuration de développement ; les résultats historiques restent dans reports/.
# Le protocole corrigé règle les hyperparamètres à l'intérieur de chaque pli train.
defaults:
  data: configs/data.yaml
  model: configs/model_cnn_lstm.yaml

training:
  seed: 42
  epochs: 12
  batch_size: 512
  optimizer:
    name: adamw
    lr: 1.649184589567592e-3      # issu de la recherche Optuna (phase 3.5)
    weight_decay: 1.5862776574507062e-3
  loss:
    name: bce_with_logits
    # Pondération de la classe positive par le ratio négatifs/positifs du pli
    # d'entraînement, recalculée à chaque pli.
    pos_weight: auto
  early_stopping:
    monitor: val_loss
    patience: 3
    mode: min

evaluation:
  # Seuil fixe : toutes les métriques du mémoire sont calculées à 0,5.
  # L'effet de ce choix est quantifié par scripts/phase6_analysis.py.
  decision_threshold: 0.5
  metrics: [f1, auroc, auprc, sensitivity, specificity, accuracy]
  per_patient_report: true

logging:
  out_dir: artifacts
  experiment_name: cnn_lstm_phase35
  save_best_only: true

protocol:
  name: nested_patient_cv_v1
  inner_splits: 3
  trials: 3                 # par pli externe ; --trials 0 = configuration fixe explicite
